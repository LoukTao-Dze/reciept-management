<app-layout-sidebar
  [activeSection]="'inventory'"
  [mobileOpen]="isSidebarOpen"
  (closeClick)="closeSidebar()"
></app-layout-sidebar>

<button
  aria-label="Dismiss sidebar overlay"
  class="fixed inset-y-0 left-72 right-0 z-40 bg-black/40 transition-opacity duration-300 ease-in-out lg:hidden"
  [class.opacity-100]="isSidebarOpen"
  [class.opacity-0]="!isSidebarOpen"
  [class.pointer-events-none]="!isSidebarOpen"
  type="button"
  (click)="closeSidebar()"
></button>

<div
  class="pl-0 transition-[padding] duration-300 ease-in-out"
  [ngClass]="isSidebarOpen ? 'lg:pl-72' : 'lg:pl-0'"
>
  <app-layout-topbar
    [sidebarOpen]="isSidebarOpen"
    (menuClick)="toggleSidebar()"
  ></app-layout-topbar>

  <main class="relative min-h-screen bg-surface pt-16 lg:pt-20">
    <div class="flex h-full w-full flex-col overflow-y-auto p-md sm:p-lg lg:p-margin-desktop">
      <div class="flex flex-col gap-lg">
        <app-inventory-header
          (addIngredientClick)="openAddIngredientDialog()"
        ></app-inventory-header>

        <div class="grid grid-cols-12 gap-lg">
          <div class="col-span-12 flex flex-col gap-lg lg:col-span-8">
            <app-inventory-table></app-inventory-table>
          </div>

          <div class="col-span-12 flex flex-col gap-lg lg:col-span-4">
            <app-inventory-stock-entry-card
              (stockEntrySaved)="onStockEntrySaved($event)"
            ></app-inventory-stock-entry-card>
            <app-inventory-alerts-card></app-inventory-alerts-card>
            <app-inventory-weekly-report-card></app-inventory-weekly-report-card>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
