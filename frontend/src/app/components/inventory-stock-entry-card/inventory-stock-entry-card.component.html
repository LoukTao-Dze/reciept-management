<div class="group relative overflow-hidden rounded-xl bg-surface-container-lowest p-md shadow-sm">
  <div
    class="absolute -right-8 -top-8 h-32 w-32 rounded-full bg-primary/5 blur-2xl transition-colors duration-500 group-hover:bg-primary/10"
  ></div>

  <div class="relative z-10 mb-md flex items-center justify-between gap-sm">
    <h3 class="font-headline-sm text-headline-sm text-on-surface">บันทึกการซื้อเข้า</h3>
    <span class="font-label-sm text-label-sm text-on-surface-variant"
      >บันทึกเมื่อ {{ entryDate }}</span
    >
  </div>

  <form class="relative z-10 flex flex-col gap-sm" (ngSubmit)="saveStockEntry()">
    <div class="flex flex-col gap-xs">
      <label class="font-label-sm text-label-sm text-on-surface-variant">เลือกวัตถุดิบ</label>
      <div class="relative">
        <!-- <select
          class="w-full appearance-none rounded-lg border border-outline-variant/50 bg-surface-container-low px-sm py-sm font-body-md text-body-md text-on-surface transition-colors focus:border-primary focus:outline-none"
          [(ngModel)]="name"
          name="name"
        >
          @for (option of ingredientOptions; track option) {
            <option [value]="option">{{ option }}</option>
          }
        </select> -->
        <input
          class="w-full rounded-lg border border-outline-variant/50 bg-surface-container-low px-sm py-sm font-body-md text-body-md text-on-surface transition-colors focus:border-primary focus:outline-none"
          [(ngModel)]="name"
          name="name"
          placeholder="วัตถุดิบ"
          type="text"
        />
        <!-- <span
          class="material-symbols-outlined pointer-events-none absolute right-sm top-1/2 -translate-y-1/2 text-on-surface-variant"
          >expand_more</span
        > -->
      </div>
    </div>

    <div class="grid grid-cols-3 gap-sm">
      <div class="flex flex-col gap-xs">
        <label class="font-label-sm text-label-sm text-on-surface-variant">จำนวน</label>
        <input
          class="w-full rounded-lg border border-outline-variant/50 bg-surface-container-low px-sm py-sm font-body-md text-body-md text-on-surface transition-colors focus:border-primary focus:outline-none"
          [(ngModel)]="amount"
          min="0"
          name="amount"
          placeholder="0"
          type="number"
        />
      </div>

      <div class="flex flex-col gap-xs">
        <label class="font-label-sm text-label-sm text-on-surface-variant">หน่วย</label>
        <select
          class="w-full appearance-none rounded-lg border border-outline-variant/50 bg-surface-container-low px-sm py-sm font-body-md text-body-md text-on-surface transition-colors focus:border-primary focus:outline-none"
          [(ngModel)]="unit"
          name="unit"
        >
          @for (unitOption of units; track unitOption) {
            <option [value]="unitOption">{{ unitOption }}</option>
          }
        </select>
      </div>

      <div class="flex flex-col gap-xs">
        <label class="font-label-sm text-label-sm text-on-surface-variant">ราคารวม (บาท)</label>
        <input
          class="w-full rounded-lg border border-outline-variant/50 bg-surface-container-low px-sm py-sm font-body-md text-body-md text-on-surface transition-colors focus:border-primary focus:outline-none"
          [(ngModel)]="totalPrice"
          min="0"
          name="totalPrice"
          placeholder="0.00"
          type="number"
        />
      </div>
    </div>

    <div class="flex flex-col gap-xs">
      <label class="font-label-sm text-label-sm text-on-surface-variant">วันหมดอายุ</label>
      <input
        class="w-full rounded-lg border border-outline-variant/50 bg-surface-container-low px-sm py-sm font-body-md text-body-md text-on-surface transition-colors focus:border-primary focus:outline-none"
        [(ngModel)]="expiryDate"
        name="expiryDate"
        type="date"
      />
    </div>

    <div class="flex flex-col gap-xs">
      <label class="font-label-sm text-label-sm text-on-surface-variant"
        >แจ้งเตือนเมื่อคงเหลือต่ำกว่า</label
      >
      <div class="flex items-center gap-sm">
        <input
          class="w-full rounded-lg border border-outline-variant/50 bg-surface-container-low px-sm py-sm font-body-md text-body-md text-on-surface transition-colors focus:border-primary focus:outline-none"
          [(ngModel)]="alertThreshold"
          min="0"
          name="alertThreshold"
          placeholder="0"
          type="number"
        />
        <span class="min-w-16 font-label-sm text-label-sm text-on-surface-variant">{{ unit }}</span>
      </div>
    </div>

    <button
      class="mt-sm w-full rounded-xl border border-primary/20 bg-surface-container py-sm font-label-md text-label-md text-primary transition-colors hover:bg-surface-container-high disabled:cursor-not-allowed disabled:opacity-50"
      [disabled]="
        !name ||
        amount === null ||
        amount <= 0 ||
        totalPrice === null ||
        totalPrice < 0 ||
        !expiryDate
      "
      type="submit"
    >
      บันทึกรับเข้าสต็อก
    </button>
  </form>
</div>
