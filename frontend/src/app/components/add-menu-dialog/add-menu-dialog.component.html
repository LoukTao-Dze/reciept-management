<div
  class="relative flex max-h-[90vh] w-full max-w-4xl flex-col overflow-hidden rounded-2xl bg-surface-container-lowest shadow-2xl"
>
  <div
    class="flex items-center justify-between border-b border-outline-variant bg-primary/5 px-lg py-md"
  >
    <div class="flex items-center gap-sm">
      <span class="material-symbols-outlined text-primary">add_circle</span>
      <h2 class="font-headline-md text-on-surface">เพิ่มเมนูอาหารใหม่</h2>
    </div>
    <button
      class="rounded-full p-1 text-on-surface-variant transition-colors hover:bg-surface-container-high"
      type="button"
      (click)="closeDialog()"
    >
      <span class="material-symbols-outlined">close</span>
    </button>
  </div>

  <div class="flex-1 overflow-y-auto p-lg">
    <div class="grid grid-cols-1 gap-xl md:grid-cols-2">
      <div class="space-y-lg">
        <div class="flex flex-col gap-xs">
          <label class="font-label-md text-on-surface-variant">ชื่อเมนู</label>
          <input
            class="w-full rounded-xl border border-outline-variant bg-surface-container-low px-md py-sm outline-none transition-all focus:ring-2 focus:ring-primary/30"
            [(ngModel)]="menuName"
            placeholder="เช่น ต้มยำกุ้งน้ำข้น"
            type="text"
          />
        </div>

        <div class="flex flex-col gap-xs">
          <label class="font-label-md text-on-surface-variant">หมวดหมู่</label>
          <input
            class="w-full rounded-xl border border-outline-variant bg-surface-container-low px-md py-sm outline-none transition-all focus:ring-2 focus:ring-primary/30"
            [(ngModel)]="category"
            placeholder="เช่น อาหารจานหลัก, ของหวาน"
            type="text"
          />
        </div>

        <div class="flex flex-col gap-xs">
          <label class="font-label-md text-on-surface-variant">ราคาขาย (บาท)</label>
          <input
            class="w-full rounded-xl border border-outline-variant bg-surface-container-low px-md py-sm font-bold text-headline-sm text-primary outline-none transition-all focus:ring-2 focus:ring-primary/30"
            [(ngModel)]="price"
            placeholder="0.00"
            type="number"
          />
        </div>

        <div class="flex flex-col gap-xs">
          <label class="font-label-md text-on-surface-variant">รูปภาพเมนู</label>
          <input
            #imageInput
            class="hidden"
            accept="image/*"
            type="file"
            (change)="uploadImage($event)"
          />
          <div
            class="flex h-40 w-full cursor-pointer flex-col items-center justify-center gap-sm rounded-xl border-2 border-dashed border-outline-variant bg-surface-container-low transition-colors hover:bg-surface-container"
            role="button"
            tabindex="0"
            (click)="imageInput.click()"
            (keydown.enter)="imageInput.click()"
            (keydown.space)="imageInput.click()"
          >
            @if (imageUrl) {
              <img
                class="h-full w-full rounded-lg object-cover"
                [src]="imageUrl"
                alt="ตัวอย่างรูปภาพเมนู"
              />
            } @else {
              <span class="material-symbols-outlined text-4xl text-on-surface-variant/50"
                >add_a_photo</span
              >
              <span class="font-label-sm text-on-surface-variant/70">คลิกเพื่ออัปโหลดรูปภาพ</span>
            }
          </div>
        </div>
      </div>

      <div class="flex flex-col gap-md">
        <div class="flex items-center justify-between">
          <h3 class="font-label-md font-bold text-on-surface">จัดการวัตถุดิบ/สูตร</h3>
          <button
            class="flex items-center gap-1 text-primary hover:underline"
            type="button"
            (click)="addIngredient()"
          >
            <span class="material-symbols-outlined text-[18px]">add_circle</span>
            เพิ่มวัตถุดิบ
          </button>
        </div>

        <div class="min-h-[200px] space-y-sm rounded-xl bg-surface-container-low p-sm">
          @for (ingredient of ingredients; track $index) {
            <div
              class="flex items-center gap-sm rounded-lg border border-outline-variant/30 bg-surface-container-lowest p-sm"
            >
              <div class="w-full">
                <select
                  class="w-full border-b border-outline-variant bg-transparent text-sm text-on-surface-variant outline-none transition-colors focus:border-primary"
                  [(ngModel)]="ingredient.name"
                  aria-label="วัตถุดิบ"
                >
                  <option value="">เลือกวัตถุดิบ</option>
                  @for (item of ingredientsList; track item.name) {
                    <option [value]="item.name">{{ item.name }}</option>
                  }
                </select>
              </div>
              <div class="w-30">
                <input
                  class="w-full border-b border-outline-variant bg-transparent text-right outline-none"
                  [(ngModel)]="ingredient.quantity"
                  placeholder="ปริมาณ"
                  type="number"
                />
              </div>
              <select
                class="w-24 border-b border-outline-variant bg-transparent text-sm text-on-surface-variant outline-none transition-colors focus:border-primary"
                [(ngModel)]="ingredient.unit"
                aria-label="หน่วยวัตถุดิบ"
              >
                @for (unit of listUnitOfIngredient; track unit.value) {
                  <option [value]="unit.value">{{ unit.label }}</option>
                }
              </select>
            </div>
          } @empty {
            <p class="py-xl text-center font-label-sm text-on-surface-variant/50">
              ยังไม่มีการเพิ่มวัตถุดิบ
            </p>
          }
        </div>

        <div class="mt-auto space-y-sm rounded-xl border border-primary/10 bg-primary/5 p-md">
          <div class="flex items-center justify-between">
            <span class="font-label-md text-on-surface-variant">ต้นทุนรวม</span>
            <span class="font-headline-sm text-on-surface">฿0.00</span>
          </div>
          <div class="flex items-center justify-between">
            <span class="font-label-md text-on-surface-variant">กำไรคาดการณ์</span>
            <div class="text-right">
              <span class="block font-headline-sm text-[#22c55e]">฿0.00</span>
              <span class="font-label-sm text-[#22c55e] opacity-80">(0%)</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div
    class="flex items-center justify-end gap-md border-t border-outline-variant bg-surface-container-low px-lg py-md"
  >
    <button
      class="rounded-full px-xl py-sm font-label-md text-on-surface-variant transition-all hover:bg-surface-container-high"
      type="button"
      (click)="closeDialog()"
    >
      ยกเลิก
    </button>
    <button
      class="transform rounded-full bg-primary px-xl py-sm font-label-md font-bold text-on-primary shadow-md transition-all hover:-translate-y-1 hover:bg-surface-tint"
      type="button"
      [disabled]="!menuName.trim() || !category.trim() || price === null || price < 0"
      (click)="saveMenu()"
    >
      บันทึกเมนูใหม่
    </button>
  </div>
</div>
